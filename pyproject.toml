[project]
name = "gatekeeper"
version = "0.1.0"
description = "Verify Cloudflare Access tokens; anything unverified gets the public version of your app"
readme = "README.md"
authors = [
    { name = "Evan Appel", email = "28764149+EvanWAppel@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.15.1,<3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
